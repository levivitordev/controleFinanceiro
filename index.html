<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saldo · Controle financeiro</title>
<script>
try {
  const theme=localStorage.getItem('saldo-theme');
  if(theme==='light'||theme==='dark') document.documentElement.dataset.theme=theme;
} catch {}
</script><link rel="stylesheet" href="style.css"><header><div class="brand"><i aria-hidden="true">◒</i> saldo</div><button id="theme" type="button" aria-label="Modo escuro" aria-pressed="false">Modo escuro</button></header><main>
<div class="row heading"><div><h1>Meu orçamento</h1></div><input type="month" id="month" aria-label="Mês de referência" required></div>
<div class="overview"><section class="hero"><span id="caption"></span><strong id="balance"></strong><div id="warning" role="status"></div><div class="meter"><div class="row"><span>Valor comprometido</span><b id="commitment"></b></div><progress id="progress" max="100"></progress><small id="ratio"></small></div></section>
<section class="salary"><div class="symbol" aria-hidden="true">↻</div><h2>Renda mensal</h2><strong id="salaryValue"></strong><p>Defina sua renda uma vez para planejar os próximos meses.</p><button id="salaryButton"></button></section></div>
<div class="metrics"><section><em>↙</em><div>Receitas do mês<b id="income"></b></div></section><section><em>↗</em><div>Gastos e parcelas<b id="spent"></b></div></section><section><em>◇</em><div>Reserva planejada<b id="saved"></b></div></section></div>
<div class="ledger"><section><div class="row"><h2>Lançamentos</h2><button class="primary" id="add">+ Adicionar gasto</button></div><div id="entries"></div></section><section><h2>Parcelas futuras</h2><div id="future"></div></section></div>
<dialog id="salaryDialog"><form id="salaryForm"><h2>Minha renda mensal</h2><p id="effective"></p><label>Valor mensal (R$)<input id="salaryAmount" type="number" min="0" max="999999999" step=".01" required></label><div class="row"><button type="button" onclick="this.closest('dialog').close()">Cancelar</button><button class="primary">Salvar renda</button></div></form></dialog>
<footer>Dados salvos neste navegador. <button id="backup">Exportar cópia</button> <button id="restore">Restaurar cópia</button><input id="file" type="file" accept=".json" hidden></footer>
<dialog id="editor"><form id="form"><h2 id="title"></h2><label>Descrição<input name="description" maxlength="100" required></label><label>Tipo<select name="kind"><option value="expense">Despesa</option><option value="income">Receita</option><option value="reserve">Reserva planejada</option></select></label><label>Valor total (R$)<input name="amount" type="number" min=".01" max="999999999" step=".01" required></label><label>Mês da primeira cobrança ou entrada<input type="month" name="start" required></label><label>Número de parcelas<input name="count" type="number" min="1" max="120" value="1" required></label><div class="row"><button type="button" id="cancel">Cancelar</button><button class="primary">Salvar</button></div></form></dialog></main><script src="app.js"></script></html>
