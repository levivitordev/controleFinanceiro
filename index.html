<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saldo · Controle financeiro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#173c32;font:16px "Segoe UI",sans-serif}header,main{max-width:1060px;margin:auto;padding:22px}header,.row,article{display:flex;align-items:center;justify-content:space-between;gap:14px}header{border-bottom:1px solid #cfdbd3}header b{font: bold 30px Georgia}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(32px,5vw,54px);margin:20px 0}section,dialog{background:white;border:1px solid #d9ded6;border-radius:16px;padding:24px;margin:16px 0}.hero{background:#163e34;color:white}.hero strong{display:block;font:54px Georgia;margin:8px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metrics section{margin:0}.metrics b{display:block;margin-top:8px;font-size:23px}button,input,select{font:inherit;border:1px solid #bdcbc2;border-radius:8px;padding:9px;background:white;color:inherit}button{cursor:pointer}.primary{background:#bce7a0;color:#183d2f;border:0;font-weight:650}article{border-top:1px solid #e4e8e3;padding:12px 0}article small{display:block;color:#59685f}dialog{margin:auto;width:min(440px,96vw);color:inherit}dialog::backdrop{background:#1238}label{display:grid;gap:4px;margin-bottom:12px}footer{font-size:14px;margin:20px 0}p{line-height:1.5}@media(max-width:620px){.metrics{grid-template-columns:1fr}.row{flex-wrap:wrap}section{padding:16px}article{flex-wrap:wrap}}
</style><header><b>◒ Saldo</b><span>Controle pessoal</span></header><main>
<div class="row"><h1>Visão do mês</h1><input type="month" id="month" aria-label="Mês de referência" required></div>
<section class="hero"><span id="caption"></span><strong id="balance"></strong><p>Receitas do mês menos despesas, parcelas e reserva planejada.</p></section>
<div class="metrics"><section>Receitas<b id="income"></b></section><section>Despesas do mês<b id="spent"></b></section><section>Reserva planejada<b id="saved"></b></section></div>
<section><div class="row"><h2>Lançamentos</h2><button class="primary" id="add">+ Novo lançamento</button></div><div id="entries"></div></section>
<section><h2>Parcelas futuras</h2><div id="future"></div></section>
<footer>Dados salvos neste navegador. <button id="backup">Exportar cópia</button> <button id="restore">Restaurar cópia</button><input id="file" type="file" accept=".json" hidden></footer>
<dialog id="editor"><form id="form"><h2 id="title"></h2><label>Descrição<input name="description" maxlength="100" required></label><label>Tipo<select name="kind"><option value="expense">Despesa</option><option value="income">Receita</option><option value="reserve">Reserva planejada</option></select></label><label>Valor total (R$)<input name="amount" type="number" min=".01" max="999999999" step=".01" required></label><label>Mês da primeira cobrança ou entrada<input type="month" name="start" required></label><label>Número de parcelas<input name="count" type="number" min="1" max="120" value="1" required></label><div class="row"><button type="button" id="cancel">Cancelar</button><button class="primary">Salvar</button></div></form></dialog></main><script src="app.js"></script></html>
